<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Vairagya Events Venue 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen 3D app — slim top bar, full-bleed scene, floating info card, zoom pad, scrollable area chips at the bottom */
:root{
  --bg:#F4F6F2; --panel:rgba(255,255,255,.95); --ink:#16261D; --ink-2:#5A6B60; --rule:#D6DED6; --accent:#D9261C; --hl:#FFC83D; --chip:#FFFFFF;
  --brand:#13704A; --brand-2:#1F9447; --on-brand:#FFFFFF; --lbl:rgba(15,82,52,.9);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1612;--panel:rgba(22,32,26,.95);--ink:#E3ECE5;--ink-2:#98AA9E;--rule:#2B3A31;--accent:#F05A4F;--chip:#18231C;--brand:#3DBA6E;--brand-2:#5CCB85;--on-brand:#0B1A11;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1612;--panel:rgba(22,32,26,.95);--ink:#E3ECE5;--ink-2:#98AA9E;--rule:#2B3A31;--accent:#F05A4F;--chip:#18231C;--brand:#3DBA6E;--brand-2:#5CCB85;--on-brand:#0B1A11;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--bg)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:46px;width:auto;flex:none}
.brand .vr{width:1px;align-self:stretch;background:var(--rule)}
.tabs{display:flex;gap:4px;margin-top:5px}
.tabs a{font:600 12px var(--body);text-decoration:none;color:var(--ink-2);padding:3px 9px;border-radius:99px;border:1px solid var(--rule)}
.tabs a[aria-current]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:560px){.brand img{height:36px}.brand .vr{display:none}}
h1{font-family:var(--display);color:var(--brand);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
.sub{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:3px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--chip)}
.seg button,.tog{border:0;background:transparent;color:var(--ink);font:500 12.5px var(--body);padding:7px 11px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.tog{border:1px solid var(--rule);border-radius:7px;background:var(--chip)}
.tog[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.stage-wrap{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;font:700 12px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--lbl);padding:4px 7px 4px;border-radius:4px;white-space:nowrap;border:0;transition:opacity .2s}
.lb::after{content:"";position:absolute;left:50%;bottom:-4px;width:2px;height:4px;margin-left:-1px;background:var(--lbl)}
.lb.sel{background:var(--hl);color:#1E2A22}
.lb.sel::after{background:var(--hl)}
.lb.big{font-size:14px}
.card{z-index:2000;position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));width:min(320px,calc(100% - 24px));background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--rule);border-radius:10px;padding:13px 15px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.card h2{font-family:var(--display);font-size:24px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;padding-right:28px}
.chipc{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:99px;color:#fff;margin-bottom:8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 8px;font-size:12.5px}
.card dt{color:var(--ink-2)} .card dd{margin:0;font-family:var(--mono);font-size:12px}
.card p{margin:0;font-size:12.5px;color:var(--ink-2)}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.zoom{z-index:2000;position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:600 20px/1 var(--body);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hint{z-index:2000;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--lbl);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:99px;display:flex;gap:14px;white-space:nowrap;transition:opacity .5s;pointer-events:none}
.hint.gone{opacity:0}
@media (max-width:560px){.hint{flex-direction:column;gap:2px;border-radius:12px;text-align:center}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:9px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--rule);background:var(--bg);scrollbar-width:thin}
.chips button{flex:none;border:1px solid var(--rule);background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px;font:500 12.5px var(--body);cursor:pointer;display:flex;align-items:center;gap:6px}
.chips button.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);color:var(--brand)}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <div class="bar">
    <div class="brand">
      <img src="logo.png" alt="Vairagya Events">
      <span class="vr"></span>
      <div>
        <h1>Venue 3D Map</h1>
        <div class="sub">Kutch Heritage Lawns · wedding layout · ≈ 175 × 72 m</div>
        <nav class="tabs" aria-label="Map type"><a href="#" aria-current="page">3D view</a><a href="plan.html">2D plan</a></nav>
      </div>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Camera views">
        <button id="v-over" class="on">Overview</button>
        <button id="v-top">Top (2D)</button>
        <button id="v-stage">Guest view</button>
        <button id="v-entry">Entry</button>
      </div>
      <button class="tog" id="t-labels" aria-pressed="true">Labels</button>
      <button class="tog" id="t-night" aria-pressed="false">Night</button>
      <button class="tog" id="t-spin" aria-pressed="false">Auto-rotate</button>
    </div>
  </div>

  <div class="stage-wrap" id="wrap">
    <div class="loading" id="loading">Building the venue…</div>
    <canvas id="c" tabindex="0" aria-label="3D model of the venue. Drag to rotate, pinch or scroll to zoom, two fingers or right-drag to move."></canvas>
    <div class="labels" id="labels"></div>
    <div class="card" id="card" hidden></div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zreset" aria-label="Reset view" style="font-size:15px">⟲</button>
    </div>
    <div class="hint" id="hint"><span>☝ Drag to rotate</span><span>🤏 Pinch to zoom</span><span>✌ Two fingers to move</span><span>Tap anything for details</span></div>
  </div>

  <div class="chips" id="chips" aria-label="Jump to an area"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
if(!window.THREE||!THREE.OrbitControls){$("#loading").textContent="The 3D engine could not load. Check your connection and reload.";return}

// ---------------- data (same plan as the 2D map; metres) ----------------
const CAT={stage:{n:"Stage & seating",c:"#1F4E9A"},hall:{n:"Halls & rooms",c:"#7A8794"},food:{n:"Food",c:"#D7252B"},wash:{n:"Washrooms",c:"#1F8A86"},decor:{n:"Decor & lounges",c:"#C2410C"},service:{n:"Services",c:"#6D4C2F"},park:{n:"Parking & entry",c:"#8A7B6D"}};
const EL=[
 {id:"stage",n:"Stage",cat:"stage",x:15,y:22,w:9,d:18,h:7,big:1,cap:"Couple + 20 on stage",note:"1.2 m raised stage facing east, LED wall and lighting truss above."},
 {id:"aisle",n:"Red Carpet Aisle",cat:"stage",x:24,y:30.4,w:32,d:1.2,h:.6,cap:null,note:"Bride entry walk, 32 m long, lined with flower stands."},
 {id:"sofa",n:"VIP Sofa Seating",cat:"stage",x:26,y:16,w:8,d:30,h:1,cap:"72 guests",note:"Two-seater sofas for family on both sides of the aisle."},
 {id:"chairs",n:"Guest Chairs",cat:"stage",x:35,y:16,w:21,d:30,h:1,big:1,cap:"≈ 600 chairs",note:"Banquet chairs in two blocks either side of the aisle."},
 {id:"gazebo",n:"Gazebos",cat:"decor",x:21,y:9,w:20,d:6,h:4.3,cap:"3 gazebos",note:"Red gazebos for welcome drinks and the mehendi corner."},
 {id:"food",n:"Food Area",cat:"food",x:60,y:12,w:24,d:46,h:1,big:1,cap:"14 tables · 56 seats",note:"Round tables with 4 chairs each across the lawn."},
 {id:"counter1",n:"Buffet Counters",cat:"food",x:86.5,y:12,w:3,d:52,h:3,cap:"2 counter lines",note:"Main course and dessert counters with festoon lights."},
 {id:"counter2",n:"Live Counters",cat:"food",x:52,y:9.4,w:26,d:1.4,h:3,cap:"6 live stations",note:"Chaat, pasta, dosa and tandoor stations along the north edge."},
 {id:"bride",n:"Bride Room",cat:"hall",x:100,y:9,w:12,d:11,h:3.8,cap:"10 people",note:"Getting-ready room with sofa set and mirror wall. AC, attached washroom."},
 {id:"photo",n:"Photo Zone",cat:"decor",x:100,y:23,w:12,d:16,h:4,cap:null,note:"Flower arch and flower wall between the bride and groom rooms."},
 {id:"groom",n:"Groom Room",cat:"hall",x:100,y:42,w:12,d:11,h:3.8,cap:"10 people",note:"Getting-ready room for the groom's side, near the baraat start point."},

 {id:"hallA",n:"Hall A",cat:"hall",x:118,y:7,w:24,d:22,h:7,big:1,cap:"350 seated",note:"Air-conditioned German hangar for sangeet night."},
 {id:"hallB",n:"Hall B",cat:"hall",x:118,y:35,w:24,d:22,h:7,big:1,cap:"350 seated",note:"Second hangar for reception or dining backup if it rains."},
 {id:"wash",n:"Washroom Block",cat:"wash",x:40,y:60.5,w:10,d:5.5,h:3.2,cap:"10 seats (5 M · 5 F)",note:"Permanent washroom building at the south edge of the lawn."},
 {id:"caps",n:"Capsule Toilets",cat:"wash",x:72,y:61,w:12,d:4,h:2.6,cap:"5 units",note:"Portable capsule toilets with a hand-wash station. Cleaned every 2 hours."},
 {id:"dg",n:"Generator",cat:"service",x:120,y:61,w:8,d:6,h:2.6,cap:"2 × 250 kVA",note:"Fenced corner behind the kitchen, away from guests."},
 {id:"entry",n:"Guest Entry",cat:"park",x:7,y:46,w:6,d:6,h:5.4,big:1,cap:null,note:"Main gate from the road with welcome arch and security check."},
 {id:"parking",n:"Parking Area",cat:"park",x:146,y:5,w:31,d:63,h:1.5,big:1,cap:"≈ 150 cars",note:"Valet and self-parking, reached by the road along the north edge."},
];
const byId=Object.fromEntries(EL.map(e=>[e.id,e]));
const X=x=>x-90, Z=z=>z-37;

// ---------------- renderer / scene ----------------
const canvas=$("#c"),wrap=$("#wrap");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const DAY=new THREE.Color("#CFE3F2"),NIGHT=new THREE.Color("#0C1428");
scene.background=DAY.clone();scene.fog=new THREE.Fog(DAY.clone(),220,520);
const camera=new THREE.PerspectiveCamera(42,1,.5,1500);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=false;
controls.maxPolarAngle=1.48;controls.minDistance=5;controls.maxDistance=340;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
controls.zoomSpeed=1.1;controls.rotateSpeed=.7;controls.panSpeed=.9;controls.autoRotateSpeed=.6;

const hemi=new THREE.HemisphereLight(0xEAF4FF,0x7A6A50,.62);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xFFF3DD,.85);sun.position.set(-70,110,55);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-110,right:110,top:60,bottom:-60,near:10,far:320});sun.shadow.bias=-.0006;
scene.add(sun);

// ---------------- helpers ----------------
const mats={};
const M=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshLambertMaterial({color:c,...o}))};
const pickables=[];
function box(w,h,d,mat,x,y0,z,id,cast=true){ // x,z = plan top-left corner (m)
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof mat==="string"?M(mat):mat);
  m.position.set(X(x+w/2),y0+h/2,Z(z+d/2));m.castShadow=cast;m.receiveShadow=true;
  if(id){m.userData.id=id;pickables.push(m)}scene.add(m);return m;
}
function plane(w,d,mat,x,z,y=0,id){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),typeof mat==="string"?M(mat):mat);
  m.rotation.x=-Math.PI/2;m.position.set(X(x+w/2),y,Z(z+d/2));m.receiveShadow=true;
  if(id){m.userData.id=id;pickables.push(m)}scene.add(m);return m;
}
function canvasTex(w,h,draw,rx=1,ry=1){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t}
function hipRoof(x,z,w,d,y0,y1,color,id){
  const a=[0,0],b=[w,0],c=[w,d],dd=[0,d];let r1,r2;
  if(w>=d){r1=[d/2,d/2];r2=[w-d/2,d/2]}else{r1=[w/2,w/2];r2=[w/2,d-w/2]}
  const V=(p,y)=>[p[0],y,p[1]];
  const tris=[[a,b,r2,1],[a,r2,r1,1],[c,dd,r1,1],[c,r1,r2,1],[dd,a,r1,1],[b,c,r2,1]];
  const pos=[];tris.forEach(([p,q,r])=>[p,q,r].forEach(v=>{const top=(v===r1||v===r2);pos.push(...V(v,top?y1-y0:0))}));
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshPhongMaterial({color,flatShading:true,side:THREE.DoubleSide,shininess:8}));
  m.position.set(X(x),y0,Z(z));m.castShadow=true;m.receiveShadow=true;
  if(id){m.userData.id=id;pickables.push(m)}scene.add(m);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:0x9AA6B2}));e.position.copy(m.position);scene.add(e);
  return m;
}
const dummy=new THREE.Object3D();
function instanced(geo,mat,list,id,cast=true){ // list of fn(dummy) or [x,y,z,ry,sx,sy,sz]
  const im=new THREE.InstancedMesh(geo,typeof mat==="string"?M(mat):mat,list.length);
  list.forEach((p,i)=>{dummy.position.set(p[0],p[1],p[2]);dummy.rotation.set(p[7]||0,p[3]||0,0,"YXZ");dummy.scale.set(p[4]??1,p[5]??1,p[6]??1);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix)});
  im.castShadow=cast;im.receiveShadow=true;if(id){im.userData.id=id;pickables.push(im)}scene.add(im);return im;
}

// ---------------- ground ----------------
plane(900,900,"#B4AC86",-360,-413,-.06);                                   // surrounding land
plane(190,84,"#9C7B62",-3,-5,-.02);                                        // soil plot
const roadTex=canvasTex(64,256,(g,w,h)=>{g.fillStyle="#2F3236";g.fillRect(0,0,w,h);g.fillStyle="#EDEDED";g.fillRect(w/2-3,20,6,90);g.fillRect(w/2-3,148,6,90)},1,30);
plane(7,600,new THREE.MeshLambertMaterial({map:roadTex}),0,-263,.0);
plane(169,67,"#C9B3A0",9,3.5,.02);                                         // paving
const grassTex=canvasTex(128,8,(g,w,h)=>{g.fillStyle="#7CBF3B";g.fillRect(0,0,w,h);g.fillStyle="#86C846";g.fillRect(0,0,w/2,h)},10.6,1);
plane(85,58,new THREE.MeshLambertMaterial({map:grassTex}),12,8.5,.04);     // lawn
plane(6,6,"#C9B3A0",7,46,.03);
plane(31,63,"#D6C4B4",146,5,.035,"parking");
for(let y=8;y<66;y+=4.2){plane(7,.2,"#F4EEE8",150,y,.05);plane(7,.2,"#F4EEE8",166,y,.05)}
plane(29,5,"#BFA691",115.5,29.5,.04);
// walls (compound wall with gate gap + inner wall on lawn west edge)
const wallM="#E7DED2";
box(171,1.6,.35,wallM,8,0,.4);box(171,1.6,.35,wallM,8,0,73.2);box(.35,1.6,73,wallM,178.8,0,.4);
box(.35,1.6,45.6,wallM,7.6,0,.4);box(.35,1.6,21,wallM,7.6,0,52.4);
box(.25,1.2,37.5,"#8A9096",11.9,0,8.5);box(.25,1.2,14.5,"#8A9096",11.9,0,52);

// ---------------- stage ----------------
box(9,1.2,18,"#1F4E9A",15,0,22,"stage");
box(9.3,.18,.3,"#FFFFFF",14.85,1.2,39.7,"stage",false);box(9.3,.18,.3,"#FFFFFF",14.85,1.2,22,"stage",false);box(.3,.18,18,"#FFFFFF",23.85,1.2,22,"stage",false);
box(1.2,.4,3,"#163A75",24,0,23,"stage");box(1.2,.4,3,"#163A75",24,0,36,"stage");
const ledTex=canvasTex(512,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,"#7B1E5A");gr.addColorStop(.5,"#C2185B");gr.addColorStop(1,"#F2A93B");g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle="rgba(255,255,255,.95)";g.font="700 64px Georgia,serif";g.textAlign="center";g.fillText("Rohan ♥ Priya",w/2,h/2+10);g.font="500 26px Georgia,serif";g.fillText("12 · 12 · 2026",w/2,h/2+60)});
ledTex.wrapS=ledTex.wrapT=THREE.ClampToEdgeWrapping;
const LOGO="logo.png";
function withLogo(tex,draw){const img=new Image();img.onload=()=>{draw(tex.image.getContext("2d"),img);tex.needsUpdate=true};img.src=LOGO}
withLogo(ledTex,(g,img)=>{g.fillStyle="rgba(255,255,255,.9)";g.fillRect(372,206,132,44);const r=img.width/img.height;g.drawImage(img,378,210,36*r,36)});
const ledMat=new THREE.MeshLambertMaterial({map:ledTex,emissive:0xffffff,emissiveMap:ledTex,emissiveIntensity:.35});
const led=new THREE.Mesh(new THREE.PlaneGeometry(14,6),ledMat);led.position.set(X(15.6),1.3+3,Z(31));led.rotation.y=Math.PI/2;led.userData.id="stage";pickables.push(led);scene.add(led);
box(.5,6.4,14.6,"#20242A",15.05,1.2,23.7,"stage");
const truss="#9AA3AD";

  labelNodes.forEach(n=>n.b.classList.toggle("sel",n.e.id===id));
  document.querySelectorAll(".chips button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
  const card=$("#card");card.hidden=false;
  card.innerHTML=`<button class="x" aria-label="Close details">×</button><h2>${e.n}</h2><span class="chipc" style="background:${CAT[e.cat].c}">${CAT[e.cat].n}</span>

  card.querySelector(".x").onclick=deselect;
  if(fly2){
    const c=V(X(e.x+e.w/2),e.h*.4,Z(e.y+e.d/2));const size=Math.max(e.w,e.d,8);
    const dir=camera.position.clone().sub(controls.target);dir.y=0;if(dir.lengthSq()<1)dir.set(0,0,1);dir.normalize();
    const dist=size*1.6+16;flyTo(c.clone().add(dir.multiplyScalar(dist)).add(V(0,dist*.7,0)),c);clearViewBtn();
  }
}

// keep target inside the venue
const LIM={x:100,z:48};
function clampTarget(){const t=controls.target;t.x=THREE.MathUtils.clamp(t.x,-LIM.x,LIM.x);t.z=THREE.MathUtils.clamp(t.z,-LIM.z,LIM.z);t.y=THREE.MathUtils.clamp(t.y,0,10)}

// ---------------- resize & loop ----------------
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const port=w/h<.9;VIEWS.over.p.copy(port?V(-150,175,30):V(-70,85,105));VIEWS.top.p.copy(port?V(-.1,330,0):V(0,205,.1))}
new ResizeObserver(resize).observe(wrap);resize();
camera.position.copy(VIEWS.over.p);controls.target.copy(VIEWS.over.t);controls.update();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  if(fly){let k=Math.min(1,(now-fly.s)/fly.ms);const e=ease(k);camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);if(k>=1)fly=null}
  controls.update();clampTarget();
  if(selBox.visible){const s=1+Math.sin(now/300)*.015;selBox.material.opacity=1}
  renderer.render(scene,camera);updateLabels();requestAnimationFrame(loop);
}
$("#loading").remove();
requestAnimationFrame(loop);
window.__ready=true;
})();
</script>
